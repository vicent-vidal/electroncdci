  # Job 2: Build Windows con Azure Signing
  build-windows:
    # needs: test
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Install Azure Trusted Signing tools
        run: |
          Invoke-WebRequest -Uri "https://www.nuget.org/api/v2/package/Microsoft.Trusted.Signing.Client" -OutFile "signing-tool.zip"
          Expand-Archive -Path "signing-tool.zip" -DestinationPath "$env:TEMP\signing-tool"
          $env:PATH += ";$env:TEMP\signing-tool\tools"
        shell: pwsh
        continue-on-error: true
      
      - name: Build Electron App (Unsigned)
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Sign Windows Executable with Azure Trusted Signing
        run: |
          Write-Host "Skipping code signing - Azure Trusted Signing integration pending"
          Write-Host "Files built successfully in release/ folder"
          Get-ChildItem -Path "release/*.exe" -Recurse | ForEach-Object {
            Write-Host "  - $($_.FullName)"
          }
        shell: pwsh
        continue-on-error: true
      
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/*.exe
          retention-days: 30

